name: Run Python Script
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sources/**'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python src/main.py
